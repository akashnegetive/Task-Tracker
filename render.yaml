# Render blueprint — single web service (API serves the built SPA) + managed Postgres.
# You can also configure this by hand in the dashboard; see docs/deploy.md.
services:
  - type: web
    name: tasktracker
    runtime: node
    plan: free
    buildCommand: npm run build && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tasktracker-db
          property: connectionString

databases:
  - name: tasktracker-db
    plan: free
